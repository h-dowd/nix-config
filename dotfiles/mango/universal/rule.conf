# =====================================================================
# Window Rules
# =====================================================================

# --- Picture-in-Picture ---
# Float, fixed 16:9 size, snapped to bottom-right corner (offsetx/offsety are % from
# centre, ±100 = usable screen edge)
window_rule=is_floating:1,no_border:1,width:720,height:405,offset_x:100,offset_y:100,app_id:firefox,title:Picture-in-Picture
window_rule=is_floating:1,no_border:1,width:720,height:405,offset_x:100,offset_y:100,app_id:zen-beta,title:Picture-in-Picture
window_rule=is_floating:1,no_border:1,width:720,height:405,offset_x:100,offset_y:100,app_id:librewolf,title:Picture-in-Picture
window_rule=is_floating:1,no_border:1,width:720,height:405,offset_x:100,offset_y:100,app_id:chromium,title:Picture in picture
window_rule=is_floating:1,no_border:1,width:720,height:405,offset_x:100,offset_y:100,app_id:google-chrome,title:Picture in picture
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,title:Picture-in-Picture
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,title:Picture in picture
window_rule=animation_type_open:zoom,title:Picture-in-Picture
window_rule=animation_type_close:zoom,title:Picture-in-Picture

# --- Steam ---
# Main window floats at a reasonable size
window_rule=is_floating:1,no_size_hint:1,width:1000,height:700,app_id:steam
# Steam notification position: configure inside Steam itself —
# Settings > Interface > "Notification position" dropdown — no windowrule needed
window_rule=animation_type_open:zoom,app_id:steam
window_rule=animation_type_close:zoom,app_id:steam

# --- System monitor ---
window_rule=is_named_scratchpad:1,width:900,height:600,app_id:sysmonitor
window_rule=animation_type_open:zoom,app_id:sysmonitor
window_rule=animation_type_close:zoom,app_id:sysmonitor

# --- Audio / Bluetooth / Network ---
window_rule=is_floating:1,app_id:pavucontrol
window_rule=width:900,height:600,app_id:pavucontrol
window_rule=is_floating:1,app_id:blueman-manager
window_rule=width:900,height:600,app_id:blueman-manager
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=width:800,height:600,app_id:nm-connection-editor

# --- Calculator ---
window_rule=is_floating:1,app_id:gnome-calculator
window_rule=is_floating:1,app_id:galculator
window_rule=animation_type_open:zoom,app_id:gnome-calculator
window_rule=animation_type_close:zoom,app_id:gnome-calculator
window_rule=animation_type_open:zoom,app_id:galculator
window_rule=animation_type_close:zoom,app_id:galculator

# --- File pickers (xdg-desktop-portal) ---
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,title:Open File
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,title:Open Files
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,title:Save File
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,title:Save As

# --- Zoom ---
window_rule=is_floating:1,app_id:zoom

# --- Nextcloud tray popup ---
window_rule=is_floating:1,no_border:1,width:450,height:600,offset_x:100,offset_y:-100,app_id:com.nextcloud.desktopclient.nextcloud,title:Nextcloud
window_rule=animation_type_open:zoom,app_id:com.nextcloud.desktopclient.nextcloud,title:Nextcloud
window_rule=animation_type_close:zoom,app_id:com.nextcloud.desktopclient.nextcloud,title:Nextcloud

# --- Terminals: mark for terminal swallowing ---
# When a terminal launches a GUI app, the terminal hides (swallows) behind it.
# Add any terminal emulators you use.
window_rule=is_term:1,app_id:foot
window_rule=is_term:1,app_id:kitty
window_rule=is_term:1,app_id:Alacritty

# --- Per-app opacity overrides ---
# These apps should always appear fully opaque regardless of unfocused_opacity
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^mpv$
#windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^foot$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^obsidian$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^zen-beta$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^firefox$

# --- polkit / misc floating ---
# The two `appid:Rofi` rules that used to sit here are GONE (2026-08-20). rofi
# 2.0 is a layer surface, not a toplevel — `mmsg get all-clients` does not list
# it while it is on screen — so neither could ever match, and `isnoborder`
# described the opposite of what happens: rofi has no compositor border to
# suppress, which is why it draws its own. The layerrules below are what reach
# it. docs/gotchas.md -> rofi.
window_rule=is_floating:1,app_id:xfce-polkit

# =====================================================================
# Named Workspaces
# =====================================================================

# Named scratchpads
window_rule=is_named_scratchpad:1,width:1200,height:800,app_id:Spotify
window_rule=is_named_scratchpad:1,width:1100,height:750,app_id:equibop

# =====================================================================
# Layer Rules
# =====================================================================

# rofi. These two are Arch carryover that had matched nothing since the
# migration — not because the name was wrong, but because nothing invoked rofi.
# It is the right name: rofi 2.0 passes the literal "rofi" as the
# zwlr_layer_surface namespace (source/wayland/display.c:1616). Live now.
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# swaync — notifications appear top-right (configured in swaync/config.jsonc)
# These rules control animation and strip the shadow from the panel/popups
layer_rule=no_shadow:1,layer_name:swaync-control-center
layer_rule=no_shadow:1,layer_name:swaync-notification-window
layer_rule=animation_type_open:fade,layer_name:swaync-control-center
layer_rule=animation_type_close:fade,layer_name:swaync-control-center
layer_rule=animation_type_open:fade,layer_name:swaync-notification-window
layer_rule=animation_type_close:fade,layer_name:swaync-notification-window

# Misc
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,layer_name:showkeys
