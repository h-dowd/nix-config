# Launchers, menus and panels: the desktop's Noctalia keys, on this machine's
# rofi and swaync. Most go through scripts/menus/shell.sh, the one action table.
# Modifiers as in bind.conf. docs/adr/0062

# Cmd level (⌘) ------------------------------------------------------------------

bind=SUPER+CTRL+ALT,space,spawn,~/.config/mango/scripts/menus/shell.sh launcher
# The bar's layout picker, in the slot of the desktop's shell settings.
bind=SUPER+CTRL+ALT,comma,spawn,~/.config/mango/scripts/menus/shell.sh settings
bind=SUPER+CTRL+ALT+SHIFT,v,spawn,~/.config/mango/scripts/menus/shell.sh clipboard
bind=SUPER+CTRL+ALT+SHIFT,q,spawn,~/.config/mango/scripts/menus/shell.sh lock
# swaync's own panel and clear-all; swaync-client has no list to build a rofi one.
bind=SUPER+CTRL+ALT+SHIFT,backslash,spawn,~/.config/mango/scripts/menus/shell.sh notify
bind=SUPER+CTRL+ALT+SHIFT,BackSpace,spawn,~/.config/mango/scripts/menus/shell.sh notify-clear

# Apps (⌥) -----------------------------------------------------------------------

bind=ALT,Return,spawn,kitty
bind=ALT+SHIFT,Return,spawn,foot
# The binary, not `xdg-open https://`: a stale mime entry once sent this key to
# chromium in silence. It is `zen-beta`, not `zen`.
bind=ALT,b,spawn,zen-beta
bind=ALT,e,spawn,thunar
# A file through rofi; ⌥E's job without the GUI.
bind=ALT+SHIFT,e,spawn,rofi -show recursivebrowser
# rofi-rbw is a front-end over `rbw`, not a rofi plugin. The desktop's 1Password key.
bind=ALT,p,spawn,rofi-rbw

# Laptop only: rofi has no Noctalia counterpart -------------------------------

# Apps and open windows in one list; `combi-modes` is set in config.rasi.
bind=ALT,space,spawn,rofi -show combi -show-icons
# Window mode looks icons up by lowercase appid, not desktop file. docs/adr/0060
bind=ALT,w,spawn,rofi -show window -show-icons
# Both are plugins; checks/static.sh pairs every `-show` mode with a built one.
bind=ALT,equal,spawn,rofi -show calc
bind=ALT,semicolon,spawn,~/.config/mango/scripts/menus/shell.sh emoji
# rofi's own keybindings, not mango's.
bind=ALT,F1,spawn,rofi -show keys
bind=ALT,slash,spawn,~/.config/mango/scripts/menus/shell.sh settings

# Shell panels (⌥) ---------------------------------------------------------------

bind=ALT,c,spawn,~/.config/mango/scripts/menus/shell.sh control-center
bind=ALT,d,spawn,~/.config/mango/scripts/menus/shell.sh calendar
bind=CTRL+ALT,n,spawn,~/.config/mango/scripts/menus/shell.sh network
bind=CTRL+ALT,b,spawn,~/.config/mango/scripts/menus/shell.sh bluetooth
bind=CTRL+ALT,t,spawn,~/.config/mango/scripts/menus/vpn-menu.sh
# docs/adr/0050
bind=CTRL+ALT,w,spawn,~/.config/mango/scripts/system/weather.sh panel
bind=ALT,Escape,spawn,~/.config/mango/scripts/menus/shell.sh power
# Top/bottom. `bind=` matches keycodes, so SHIFT turning / into `question` is moot.
bind=ALT+SHIFT,slash,spawn,~/.config/mango/scripts/menus/shell.sh bar
bind=ALT+SHIFT,n,spawn,~/.config/mango/scripts/menus/shell.sh dnd
# docs/adr/0031
bind=ALT+SHIFT,a,spawn,~/.config/mango/scripts/menus/shell.sh keep-awake
# TLP balanced <-> performance; fanless is the bar's right-click only. docs/adr/0017
bind=ALT+SHIFT,p,spawn,~/.config/mango/scripts/system/power-profile-cycle.sh
