# The keys whose job is the same in every mode but whose OWNER is not. Each one
# goes through scripts/menus/shell.sh, which holds the one table pairing a
# noctalia IPC call with the rofi/swaync equivalent — docs/adr/0023. Naming
# either side directly here is what made these keys dead in noctalia mode.
bind=SUPER,space,spawn,~/.config/mango/scripts/menus/shell.sh launcher
# The same question asked of a wider set: apps AND the windows already open, in
# one list. SHIFT is this config's "same subject, other variant" modifier, as
# SUPER+slash is to SUPER+SHIFT+slash.
#
# `combi-modes` is set in config.rasi, not here — its default is `window,run`,
# which is neither half of this. Bound directly rather than through shell.sh:
# noctalia's launcher has no combined view, so there is no pair to hold.
bind=SUPER+SHIFT,space,spawn,rofi -show combi -show-icons

# The two walker prefixes that were actually used, now on keys of their own.
# They were reachable before only by typing into walker's main window, which no
# bind opened — so they were one `walker` away from being unreachable already.
# `=` and `.` were the prefixes; SUPER+period is taken by focusmon, hence
# semicolon. Both modes are plugins; rofi exits 1 with "Mode is
# not found" if one is missing, so checks/static.sh pairs the two lists.
# `calc` stays rofi's in every mode: noctalia's launcher has no calculator.
bind=SUPER,equal,spawn,rofi -show calc
bind=SUPER,semicolon,spawn,~/.config/mango/scripts/menus/shell.sh emoji

# rofi-rbw is a front-end over `rbw`, not a rofi plugin — hence a bare command
# rather than `-show`. Replaced walker's `-m bitwarden`. No noctalia analogue.
bind=SUPER,p,spawn,rofi-rbw

# cliphist has been storing all along (universal/autostart.conf runs the
# wl-paste watcher); walker's clipboard provider was only ever a reader of it,
# and so is noctalia's — its clipboard view shells out to the same `cliphist`.
bind=SUPER,v,spawn,~/.config/mango/scripts/menus/shell.sh clipboard

bind=SUPER+CTRL,n,spawn,~/.config/mango/scripts/menus/shell.sh network
# vpn-menu.sh has no noctalia equivalent — its panel does wifi and bluetooth,
# not the PIA profiles this repo declares. Stays rofi in every mode.
bind=SUPER+CTRL,v,spawn,~/.config/mango/scripts/menus/vpn-menu.sh
# Was walker's `-m bluetooth`. This script already existed, hand-written and
# bound to nothing — the elephant provider had quietly replaced it.
bind=SUPER+CTRL,b,spawn,~/.config/mango/scripts/menus/shell.sh bluetooth
# The detailed reading, in rofi. There was no key for this before 2026-08-26:
# wayle's `dropdown:weather` opened from a bar click and from nowhere else, and
# com.wayle.Shell1 has no method that opens one. docs/adr/0050. No noctalia
# analogue — the same surface in every mode, so it is bound directly rather than
# through menus/shell.sh.
bind=SUPER+CTRL,w,spawn,~/.config/mango/scripts/system/weather.sh panel

bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/menus/shell.sh lock

# Reach a FILE. Every other menu here answers a question about system state;
# nothing opened a file until 2026-08-29. SUPER+E is thunar, in bind.conf, and
# this is the same job done with rofi rather than a GUI — hence the SHIFT
# variant of that key rather than a letter of its own.
#
# `SUPER,E` and `SUPER+SHIFT,e` are distinct despite the case: mango resolves
# `bind=` to KEYCODES at parse time and never consults the shift level, the same
# reason SUPER+SHIFT+slash is safe. Verified with `mango -p`, which warns on a
# real conflict.
bind=SUPER+SHIFT,e,spawn,rofi -show recursivebrowser

# rofi's OWN keybindings, which is the one thing here that documents itself.
# Worth a key because this repo hand-juggles -kb-custom-1 and CC_KB_FREE in
# control-center.sh, and checks/static.sh asserts the refresh key is not one
# rofi already ships.
#
# F1 because no F-key is bound anywhere in this config and help is F1
# everywhere else. It lists ROFI's bindings and not mango's — for mango's, read
# these files.
bind=SUPER,F1,spawn,rofi -show keys
