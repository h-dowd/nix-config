# The desktop's scheme (henry/dotfiles, mango/bind.conf), named by what mango
# receives: ⌥ = ALT, the desktop level; ⌘ = SUPER+CTRL+ALT, the "⌘ chord";
# ⌃⌘ = the chord + SHIFT; ⌘Tab = SUPER+CTRL. keyd turns the physical keys into
# these, and a new ⌘ bind needs its line there (modules/system/locale.nix).
# docs/adr/0062
# Key names: `wev`. Check after editing: `mango -p`.

# Tree, focus and layout (⌥) ----------------------------------------------------

# Where the next window goes: right / below. ⌃⌥V flips the current container.
bind=ALT,v,dwindle_split_horizontal
bind=ALT+SHIFT,v,dwindle_split_vertical
bind=CTRL+ALT,v,dwindle_toggle_current_split

bind=ALT,h,focusdir,left
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,l,focusdir,right

# Re-inserts the window beside its neighbour in the tree.
bind=ALT+SHIFT,h,move_client,left
bind=ALT+SHIFT,j,move_client,down
bind=ALT+SHIFT,k,move_client,up
bind=ALT+SHIFT,l,move_client,right

bind=ALT,grave,focuslast
# dwindle <-> monocle (circle_layout in settings.conf)
bind=ALT,comma,switch_layout
bind=ALT,a,togglemaximizescreen
bind=ALT,f,togglefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen
bind=ALT+SHIFT,space,togglefloating
bind=ALT,o,toggleoverlay
bind=ALT,g,toggleglobal

bind=ALT,i,minimized
bind=ALT+SHIFT,i,restore_minimized
# Picks which one comes back, which restore_minimized cannot. docs/adr/0052
bind=CTRL+ALT,i,spawn,~/.config/mango/scripts/menus/minimized-menu.sh

bind=ALT,r,setkeymode,resize
bind=ALT+SHIFT,r,spawn,~/.config/mango/scripts/reload.sh

bind=ALT,q,killclient
bind=CTRL+ALT+SHIFT,m,quit

# Workspaces (⌥) -----------------------------------------------------------------

bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# Move and follow
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# Move and stay
bind=CTRL+ALT+SHIFT,1,tagsilent,1
bind=CTRL+ALT+SHIFT,2,tagsilent,2
bind=CTRL+ALT+SHIFT,3,tagsilent,3
bind=CTRL+ALT+SHIFT,4,tagsilent,4
bind=CTRL+ALT+SHIFT,5,tagsilent,5
bind=CTRL+ALT+SHIFT,6,tagsilent,6
bind=CTRL+ALT+SHIFT,7,tagsilent,7
bind=CTRL+ALT+SHIFT,8,tagsilent,8
bind=CTRL+ALT+SHIFT,9,tagsilent,9

# Back-and-forth
bind=ALT,Tab,view,-1
bind=ALT+SHIFT,Tab,toggleoverview

bind=CTRL+ALT,h,viewtoleft,0
bind=CTRL+ALT,l,viewtoright,0
bind=SUPER+CTRL+ALT,h,tagtoleft,0
bind=SUPER+CTRL+ALT,l,tagtoright,0

# Monitors (laptop only: the desktop has one)
bind=CTRL+ALT,comma,focusmon,left
bind=CTRL+ALT,period,focusmon,right
bind=CTRL+ALT+SHIFT,comma,tagmon,left
bind=CTRL+ALT+SHIFT,period,tagmon,right

# Scratchpads. ⌥[ and ⌥] by keycode: on gb, `bracketleft` resolves to the 8 key
# and would take ⌥8. docs/gotchas.md → Desktop
bind=ALT,z,toggle_scratchpad
bind=ALT,code:34,toggle_named_scratchpad,Spotify,none,spotify
bind=ALT,code:35,toggle_named_scratchpad,equibop,none,equibop

bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1

# Cmd level (⌘) ------------------------------------------------------------------

# Thumbnail switcher; selects when ⌘ is released. SUPER+CTRL, not the chord:
# the remapper must hold every output modifier while ⌘ is down. docs/adr/0062
bind=SUPER+CTRL,Tab,switcher,next
bind=SUPER+CTRL+SHIFT,Tab,switcher,prev
# Closes the window, not the whole app.
bind=SUPER+CTRL+ALT,q,killclient
bind=SUPER+CTRL+ALT,Escape,killclient,force
bind=SUPER+CTRL+ALT+SHIFT,3,spawn_shell,grim - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind=SUPER+CTRL+ALT+SHIFT,4,spawn,~/.config/mango/scripts/system/screenshot-region.sh

bind=NONE,Print,spawn,~/.config/mango/scripts/system/screenshot-region.sh
bind=CTRL,Print,spawn_shell,grim - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Hardware keys ------------------------------------------------------------------

bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%-

# Mouse, trackpad --------------------------------------------------------------

mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
mousebind=ALT,btn_middle,togglemaximizescreen,0

axisbind=ALT,UP,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
axisbind=ALT,DOWN,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
axisbind=CTRL+ALT,UP,spawn_shell,brightnessctl --class=backlight set +2%
axisbind=CTRL+ALT,DOWN,spawn_shell,brightnessctl --class=backlight set 2%-

gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,togglefloating
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client

# Resize mode ------------------------------------------------------------------
# Nudge without holding a modifier; Escape, Return or ⌥R leaves.

key_mode=resize
bind=NONE,h,resizewin,-50,+0
bind=NONE,l,resizewin,+50,+0
bind=NONE,j,resizewin,+0,+50
bind=NONE,k,resizewin,+0,-50
bind=SHIFT,h,resizewin,-200,+0
bind=SHIFT,l,resizewin,+200,+0
bind=SHIFT,j,resizewin,+0,+200
bind=SHIFT,k,resizewin,+0,-200
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default
bind=ALT,r,setkeymode,default

key_mode=default
