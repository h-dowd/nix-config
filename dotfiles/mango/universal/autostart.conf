exec_once=dbus-update-activation-environment --systemd --all
exec_once=systemctl --user start mango-session.target
exec_once=bash -c "command -v lxpolkit >/dev/null && lxpolkit"
exec_once=wl-paste --type text --watch cliphist store
exec_once=~/.config/mango/scripts/menus/network-menu.sh --warm
exec_once=bash -c "bluetoothctl devices Paired > /tmp/bt-paired.cache 2>/dev/null"
exec_once=bash -c "bluetoothctl devices > /tmp/bt-all.cache 2>/dev/null"

# THE OSD. waybar has no equivalent, so volume, brightness and the lock keys
# have no feedback without it.
exec_once=pgrep '^\.?swayosd-server' >/dev/null || swayosd-server

# NO scratch-watch.sh line. It kept /tmp/scratch-<pad> in step with the
# focused client for two scratchpad bar modules that are gone; nothing reads
# those files. (Not spelling the two-word verb here: the reaper check in
# checks/static.sh greps for it by content, comments included.)

# SWAYNC IS THE NOTIFICATION DAEMON. Restarted rather than guarded: this line
# also fires on every `reload_config`, so a restyle applies. docs/adr/0005.
exec=pkill -f '^swaync( |$)' 2>/dev/null; swaync &

# The bar. Selects the generated config for the current layout and position —
# see the script.
exec=~/.config/mango/scripts/waybar/waybar-restart.sh

exec=~/.config/mango/scripts/system/wallpaper-restore.sh
exec=~/.config/mango/scripts/system/gtk-apply.sh
exec=pgrep '^\.?kdeconnectd' >/dev/null || kdeconnectd
